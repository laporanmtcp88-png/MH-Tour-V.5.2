name: MH Tour V5.3 - Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build MH Tour Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify MH Tour project
        shell: bash
        run: |
          set -e

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle.properties
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/mhtour/audio/MainActivity.kt

          test -f android/app/src/main/res/drawable/mh_tour_logo.png
          test -f android/app/src/main/res/drawable/mh_tour_icon.png
          test -f android/app/src/main/res/drawable/donation_qr.png

          echo "MH Tour project OK"

      - name: Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -e

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          echo "======================================"
          echo "MH TOUR V5.3 RELEASE APK BERHASIL"
          echo "======================================"

          ls -lh "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            MH-Tour-V5.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MH-Tour-V5.3-APK
          path: MH-Tour-V5.3.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MH Tour V5.3
          generate_release_notes: true
          files: MH-Tour-V5.3.apk
